name: Atlas Goal Biweekly Update

on:
  schedule:
    # Every other Monday at 09:00 UTC. GitHub cron has no native "every 2 weeks",
    # so the job runs weekly and the step below skips odd ISO weeks.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Run even on the off week
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post-update:
    runs-on: ubuntu-latest
    env:
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      ATLASSIAN_SITE: ${{ secrets.ATLASSIAN_SITE }}
    steps:
      - name: Biweekly gate
        id: gate
        run: |
          week=$(date -u +%V)
          if [[ "${{ inputs.force }}" == "true" ]] || (( week % 2 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: ISO week $week is an off week."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Run Claude with the atlas-update skill
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Invoke the atlas-update skill. Research and post a bi-weekly update
            directly to each of the five XLA Pages Atlas goals (XSOLLA-8722,
            8723, 8731, 8733, 8861) via the Atlassian Goals GraphQL API,
            following every step in .claude/skills/atlas-update/SKILL.md.

            For each goal: resolve its ARI, research recent activity in Jira,
            Confluence, Slack, and Drive, draft the ADF summary, then call
            .claude/skills/atlas-update/scripts/post-atlas-update.sh. Print
            each returned update URL.
          allowed_tools: >-
            Read,Write,Edit,Bash,
            mcp__github__*,
            mcp__b7815e3c-85f8-41d6-b17d-29755b5a4937__*,
            mcp__6f8662d1-3da1-4f76-9fb9-cc33e57f1f28__*,
            mcp__68578cbe-fdc5-4481-a0b3-e209974c87dc__*,
            mcp__c77c72a4-9a24-467b-9a78-3a688eea49ad__*
