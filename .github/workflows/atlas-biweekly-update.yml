name: Atlas Goal Monthly Update

on:
  schedule:
    # First Monday of each month at 09:00 UTC
    - cron: '0 9 1-7 * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Run regardless of schedule
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post-update:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      ATLASSIAN_SITE: ${{ secrets.ATLASSIAN_SITE }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run atlas-update skill
        run: |
          claude --print \
            --allowedTools "Bash" \
            "Invoke the atlas-update skill: read .claude/skills/atlas-update/SKILL.md and follow every step exactly. Research and post a monthly update directly to each of the five XLA Pages Atlas goals (XSOLLA-8722, 8723, 8731, 8733, 8861) via the Atlassian Goals GraphQL API. For each goal: resolve its ARI via goals_byKey with containerId ari:cloud:townsquare::site/9dfc393f-ac2d-4cef-8b1c-0657da26067f, research recent Jira and Confluence activity using curl with the ATLASSIAN_* env vars, draft the ADF summary (JSON-stringified), then call .claude/skills/atlas-update/scripts/post-atlas-update.sh. Print each returned update URL."
