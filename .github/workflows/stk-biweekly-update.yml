name: STK Bi-Weekly Update

on:
  schedule:
    # Every Tuesday at 04:00 UTC, which is 11:00 Asia/Bangkok.
    # Sits before Sam's usual follow-up posting window and avoids the
    # 09:00 UTC slot the two Atlas crons use.
    - cron: '0 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-update:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      ATLASSIAN_SITE: ${{ secrets.ATLASSIAN_SITE }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run stk-biweekly-update skill
        run: |
          claude --print \
            --allowedTools "Bash" \
            -- \
            "Run the stk-biweekly-update skill (.claude/skills/stk-biweekly-update/SKILL.md) end-to-end for all 7 tracked tickets."
