name: XPN Goal Update

on:
  schedule:
    # 8th and 22nd of every month at 09:00 UTC.
    - cron: '0 9 8,22 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Subscription auth (preferred). Generate locally with `claude setup-token`.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # API-credit auth (fallback). Leave unset if the org does not allow API credits.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      ATLASSIAN_SITE: ${{ secrets.ATLASSIAN_SITE }}
      GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight secrets
        run: |
          fail=0
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::no Claude auth configured. Set CLAUDE_CODE_OAUTH_TOKEN (run 'claude setup-token' locally) or ANTHROPIC_API_KEY."
            fail=1
          elif [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Claude auth: subscription OAuth token"
          else
            echo "Claude auth: ANTHROPIC_API_KEY (requires API credit balance)"
          fi
          for v in ATLASSIAN_EMAIL ATLASSIAN_API_TOKEN ATLASSIAN_SITE; do
            if [ -z "${!v}" ]; then echo "::error::required secret $v is empty"; fail=1; fi
          done
          if [ -z "$GOOGLE_OAUTH_TOKEN" ]; then echo "::warning::optional secret GOOGLE_OAUTH_TOKEN is empty; the calendar reminder will be skipped"; fi
          [ "$fail" -eq 0 ] || exit 1

      - name: Verify Atlassian credentials before burning a run
        run: |
          code="$(curl -sS -o /tmp/whoami.json -w '%{http_code}' --max-time 30 \
            -u "$ATLASSIAN_EMAIL:$ATLASSIAN_API_TOKEN" \
            "https://$ATLASSIAN_SITE/rest/api/3/myself" || echo 000)"
          case "$code" in
            200) echo "Atlassian token OK" ;;
            401|403) echo "::error::Atlassian auth failed (HTTP $code). TOKEN ROTATION NEEDED."; exit 1 ;;
            000) echo "::error::could not reach $ATLASSIAN_SITE (network/DNS), not an auth problem"; exit 1 ;;
            *)   echo "::error::unexpected HTTP $code from $ATLASSIAN_SITE"; exit 1 ;;
          esac

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run xpn-goal-update skill
        run: |
          set -o pipefail
          claude --print \
            --allowedTools "Bash" \
            -- \
            "Run the xpn-goal-update skill (.claude/skills/xpn-goal-update/SKILL.md) end-to-end." \
            2>&1 | tee /tmp/run.log

      - name: Assert an update was actually posted
        if: always()
        run: |
          [ -f /tmp/run.log ] || { echo "::error::skill step produced no log"; exit 1; }
          posted=$(grep -oE '/updates/[0-9a-f-]{36}' /tmp/run.log | sort -u | wc -l | tr -d ' ')
          skipped=$(grep -ci 'Skipping ' /tmp/run.log || true)
          {
            echo "### XPN goal update"
            echo ""
            echo "- goal updates posted: **$posted**"
            echo "- goals skipped by the 3-day duplicate guard: **$skipped**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$posted" -eq 0 ] && [ "$skipped" -eq 0 ]; then
            echo "::error::run finished but posted 0 goal updates and skipped none. Treating as a failure, not a no-op."
            tail -n 60 /tmp/run.log
            exit 1
          fi
          echo "posted=$posted skipped=$skipped"
