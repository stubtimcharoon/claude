name: XLA Pages Atlas Update

on:
  schedule:
    # Every other Wednesday at 09:00 UTC. Cron fires weekly; the biweekly
    # gate below skips odd ISO weeks so this runs on the same Wednesdays
    # as the XPN goal workflow.
    - cron: '0 9 * * 3'
  workflow_dispatch:
    inputs:
      force:
        description: Run regardless of biweekly gate
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post-update:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      ATLASSIAN_SITE: ${{ secrets.ATLASSIAN_SITE }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
    steps:
      - name: Biweekly gate
        id: gate
        run: |
          week=$(date -u +%V)
          if [[ "${{ inputs.force }}" == "true" ]] || (( week % 2 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: ISO week $week is an off week."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Install Claude Code CLI
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run xla-pages-atlas-update skill
        if: steps.gate.outputs.run == 'true'
        run: |
          claude --print \
            --allowedTools "Bash" \
            -- \
            "Run the xla-pages-atlas-update skill (.claude/skills/xla-pages-atlas-update/SKILL.md) end-to-end for all five goals."
